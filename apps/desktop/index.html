<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EnvoyHome</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="app">
      <aside id="nav" data-i18n-aria="app.settings" aria-label="Settings"></aside>
      <main id="main">
        <header class="topbar">
          <div class="brand">
            <img class="brand-mark" src="/logo.png" width="40" height="40" alt="" />
            <div class="brand-copy">
              <h1 data-i18n="app.name">EnvoyHome</h1>
              <p class="lede" data-i18n="app.lede">Home agent control plane</p>
            </div>
          </div>
          <div id="conn-chrome" class="conn-chrome" aria-live="polite">
            <span class="conn-dot" data-state="connecting"></span>
            <div class="conn-meta">
              <strong id="conn-title" data-i18n="conn.connecting">Connecting…</strong>
              <span id="conn-sub" class="muted" data-i18n="conn.loopback">loopback WebSocket</span>
            </div>
            <details class="conn-details">
              <summary data-i18n="app.connDetails">Details</summary>
              <pre id="status-out">Connecting…</pre>
            </details>
          </div>
        </header>
        <div id="toast" class="toast" hidden></div>
        <section id="view" class="panel view-panel"></section>
      </main>
    </div>
    <div id="profile-gate" class="modal-backdrop" hidden>
      <div
        class="modal-card profile-gate-card"
        role="dialog"
        aria-modal="true"
        aria-labelledby="profile-gate-title"
      >
        <img class="profile-gate-mark" src="/logo.png" width="48" height="48" alt="" />
        <h2 id="profile-gate-title" data-i18n="profile.gateTitle">Create your profile</h2>
        <p class="muted profile-gate-lede" data-i18n="profile.gateLede">
          Pick a display name for this machine. You can add more household profiles later.
        </p>
        <form id="profile-gate-form" class="profile-gate-form">
          <label class="profile-gate-field">
            <span data-i18n="profile.displayName">Display name</span>
            <input
              name="displayName"
              required
              data-i18n-placeholder="profile.displayNamePlaceholder"
              placeholder="e.g. Alice"
              autocomplete="nickname"
              autofocus
            />
          </label>
          <div class="profile-gate-actions">
            <button type="submit" data-i18n="profile.continue">Continue</button>
          </div>
        </form>
      </div>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
