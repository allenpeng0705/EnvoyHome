<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EnvoyHome</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="app">
      <aside id="nav" aria-label="Settings"></aside>
      <main id="main">
        <header class="topbar">
          <div class="brand">
            <img class="brand-mark" src="/logo.png" width="40" height="40" alt="" />
            <div class="brand-copy">
              <h1>EnvoyHome</h1>
              <p class="lede">Home agent control plane</p>
            </div>
          </div>
          <div id="conn-chrome" class="conn-chrome" aria-live="polite">
            <span class="conn-dot" data-state="connecting"></span>
            <div class="conn-meta">
              <strong id="conn-title">Connecting…</strong>
              <span id="conn-sub" class="muted">loopback WebSocket</span>
            </div>
            <details class="conn-details">
              <summary>Details</summary>
              <pre id="status-out">Connecting…</pre>
            </details>
          </div>
        </header>
        <div id="toast" class="toast" hidden></div>
        <section id="view" class="panel view-panel"></section>
      </main>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
