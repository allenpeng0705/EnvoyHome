[package]
name = "envoyhome"
version = "0.0.0"
description = "EnvoyHome — home agent Settings shell"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "envoyhome_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
