name: envoyhome
description: EnvoyHome phone thin client — pair via QR, chat/approvals over home.* (V-P2-MOB-1).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.3.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  envoyhome_mobile_client:
    path: ../../packages/mobile-client
  envoy_mesh_libp2p:
    path: ../../../EnvoyMesh/packages/envoy-mesh-libp2p-dart
  dartssh2: ^2.22.0
  mobile_scanner: ^6.0.2
  shared_preferences: ^2.5.3
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  permission_handler: ^12.0.0+1
  url_launcher: ^6.3.1
  file_picker: ^8.1.7
  speech_to_text: ^7.0.0
  flutter_markdown: ^0.7.7+1
  share_plus: ^12.0.2
  path_provider: ^2.1.6
  flutter_timezone: ^5.1.1
  geolocator: ^14.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

dependency_overrides:
  mdns_dart: 2.2.2
  pointycastle: ^4.0.0
  dart_libp2p:
    path: ../../../EnvoyMesh/vendor/dart_libp2p

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/logo.png
