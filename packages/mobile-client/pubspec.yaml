name: envoyhome_mobile_client
description: >-
  EnvoyHome thin-client skin over envoy_thin_client (Design §11.3 / §19.2).
  Speaks home.*; dials the hosting peer / LAN WS — never attach-as-phone-route
  (V-P2-MOB-1, V-P2-MESH-1, V-P2-MESH-2).
version: 0.0.0
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  envoy_thin_client:
    path: ../../../EnvoyMesh/packages/envoy-thin-client-dart
  dartssh2: ^2.22.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
